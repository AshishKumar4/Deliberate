# ReasonProxy -- exploratory Cloudflare-only conditions. NOT the active roster.
#
# The active roster is configs/research.yaml (app.py's default). Load this file
# explicitly (REASONPROXY_CONFIG or --config) when Zen is unavailable and a
# CF-only run is still wanted, or to explore a single-provider ensemble.
#
# rp/cf-homogeneous is NOT a matched homogeneity control for rp/* in
# research.yaml and does not isolate family diversity. It shares only the
# sample count (4) and the temperature multiset {0.7, 0.7, 0.7, 1.0}; the
# controller, the branch models, the provider set AND the reducer
# (red-cf-super instead of red-zen-mimo) all differ. Read it as an exploratory
# CF-only single-model system, not a one-variable comparison.
#
# Evidence status, stated exactly:
#   @cf/nvidia/nemotron-3-120b-a12b  live-verified: native tool call,
#       assistant+tool history replay, json_object output
#       (runs/onboarding/provider-contracts.json, provider-replay.json).
#   GLM 5.3 / GLM 5.3 Flash / DeepSeek V4 Pro / DeepSeek V4 Flash  exact ids
#       confirmed against an authenticated Cloudflare /ai/models/search read
#       (HTTP 200), but NOT protocol-probed. Catalog presence is not
#       tool-calling, history-replay or json-mode conformance: run
#       `python scripts/probe.py configs/cloudflare.yaml` before trusting the
#       GLM/DeepSeek conditions.
#   @cf/openai/gpt-oss-120b, @cf/moonshotai/kimi-k2.7-code and
#       @cf/google/gemma-4-26b-a4b-it are also catalog models but are not wired
#       into a condition here, so this file declares no unused backends.
#
# Workers AI calls are billed in account neurons (usage.neurons in the
# onboarding evidence) and no free entitlement for this account was verified,
# so these conditions must not be described as free. As in research.yaml there
# are no output caps and no native reasoning reductions, and no latency,
# throughput, rpm or caching number is claimed -- none was measured under
# benchmark conditions.
#
# timeout_s 300 and branch_timeout_s 420 are operational deadlines that may end
# a real, still-running generation; an expired branch is failed "timeout",
# which under min_branches 4 makes the turn a traced degraded turn.
#
# reason_mode is quoted: PyYAML is YAML 1.1, where bare `off` is boolean false.

providers:
  cf:
    # Direct Workers AI OpenAI-compatible endpoint authenticated by API token
    # (employee account: Workers AI models free; account id + token come from
    # the environment, never this file). No AI Gateway in front: gateway
    # management/inference URLs returned 403 for this token, so direct REST.
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_TOKEN
    timeout_s: 300
  zen:
    # OpenCode Zen, OpenAI-compatible chat completions. Needed only for
    # Nemotron Ultra (not on Workers AI) and the single paid Muse shape probe.
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    max_attempts: 8
    timeout_s: 300
  zen-responses:
    # Same Zen account over the Responses API: the only shape serving Muse
    # Spark Contributor Free (verified 200 on /responses with the
    # muse-spark-1.3-contributor-free id). Protocol support lives in the
    # transport; ensembles mix providers freely.
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    max_attempts: 8
    timeout_s: 300
    protocol: responses
  openrouter:
    # OpenRouter OpenAI-compatible chat completions. API key from the
    # environment, never this file. Used for models with no Workers AI
    # presence (currently: Inception Mercury 2.5 diffusion LLM).
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    max_attempts: 8
    timeout_s: 300

backends:
  # ---------------------------------------------------------------- controllers
  # No sampling parameters are declared on any backend: provider defaults
  # apply everywhere. parallel_tool_calls stays undeclared (unverified on some
  # endpoints; the engine already discards real tool calls that arrive beside
  # a reason call).
  ctrl-cf-super:
    provider: cf
    model: "@cf/nvidia/nemotron-3-120b-a12b"
  ctrl-cf-glm53:
    provider: cf
    model: "@cf/zai-org/glm-5.3"
  ctrl-cf-glm53-flash:
    provider: cf
    model: "@cf/zai-org/glm-5.3-flash"
  ctrl-cf-qwen38:
    provider: cf
    model: "@cf/qwen/qwen3.8-27b"
  ctrl-cf-deepseek-pro:
    provider: cf
    model: "@cf/deepseek-ai/deepseek-v4-pro-0813"

  # ------------------------------------------------------ single-model branches
  # Four samples of one model. The temperature multiset equals the one used by
  # the research.yaml branch roster, but the reducer and provider set differ,
  # so model identity is not the only changed variable.
  br-cf-super:
    provider: cf
    model: "@cf/nvidia/nemotron-3-120b-a12b"
  br-cf-super-hot:
    provider: cf
    model: "@cf/nvidia/nemotron-3-120b-a12b"

  # ----------------------------------------------------- Zhipu/DeepSeek branches
  # The original CF ensemble choice kept as an alternative condition: two
  # reasoning-heavy models and their flash siblings, four continuations.
  br-cf-glm53:
    provider: cf
    model: "@cf/zai-org/glm-5.3"
  br-cf-glm53-flash:
    provider: cf
    model: "@cf/zai-org/glm-5.3-flash"
  br-cf-deepseek-pro:
    provider: cf
    model: "@cf/deepseek-ai/deepseek-v4-pro-0813"
  br-cf-glm53-flash-hot:
    provider: cf
    model: "@cf/zai-org/glm-5.3-flash"
  br-cf-deepseek-flash:
    provider: cf
    model: "@cf/deepseek-ai/deepseek-v4-flash-0731"
  br-cf-qwen38:
    provider: cf
    model: "@cf/qwen/qwen3.8-27b"
  br-cf-qwen38-hot:
    provider: cf
    model: "@cf/qwen/qwen3.8-27b"
  # Nemotron Ultra (Zen free tier, chat completions with the session header
  # the engine already sends). Branch-verified; json_object reducer output did
  # not parse, so Ultra serves branches only.
  br-zen-ultra:
    provider: zen
    model: nemotron-3-ultra-free
  red-zen-ultra:
    provider: zen
    model: nemotron-3-ultra-free
  # Muse Spark Contributor Free over the Responses API (chat completions 500s;
  br-muse-contrib:
    provider: zen-responses
    model: muse-spark-1.3-contributor-free
  # Muse rejects tool_choice "none", which the fan-out uses to keep branches
  # action-free, so Muse serves controller and reducer roles only. Controller
  # and reducer calls never constrain tool choice, and branch turns stay data.
  ctrl-muse-contrib:
    provider: zen-responses
    model: muse-spark-1.3-contributor-free
  red-muse-contrib:
    provider: zen-responses
    model: muse-spark-1.3-contributor-free

  # -------------------------------------------------------------------- reducers
  # The engine sets response_format={"type": "json_object"} on the reducer call
  # itself, so it is never declared in params here.
  red-cf-super:                 # json_object output live-verified
    provider: cf
    model: "@cf/nvidia/nemotron-3-120b-a12b"
  red-cf-glm53-flash:           # json_object output NOT probed -- probe first
    provider: cf
    model: "@cf/zai-org/glm-5.3-flash"
  # Inception Mercury 2.5 (diffusion LLM) via OpenRouter. Branch + reducer
  # candidate: tools, tool_choice, response_format and structured_outputs all
  # advertised. Conformance unprobed at freeze time -- see probe rig below.
  br-or-mercury:
    provider: openrouter
    model: inception/mercury-2.5
  red-or-mercury:
    provider: openrouter
    model: inception/mercury-2.5

  # max_concurrent stays at the schema default (4) everywhere. Rate gates are
  # shared per (provider, model) and take the minimum across aliases, so all
  # five @cf/nvidia/nemotron-3-120b-a12b aliases share one limit of 4, the same
  # width as rp/cf-homogeneous's four-sample fan-out. Raising it means raising
  # it on every alias of that model, because the minimum wins. rpm is omitted
  # because no documented per-model limit was verified; Upstream retries 429s
  # with backoff.

virtual_models:
  # ===== exploratory CF-only system on the fully live-verified model =====
  # Not a diversity-isolated control; see the header.
  ctl/cf-super:
    controller: ctrl-cf-super
    reason_mode: "off"
  noop/cf-super:
    controller: ctrl-cf-super
    reason_mode: noop
    controller_prompt: concise
    max_reason_calls: 2
  rp/cf-homogeneous:
    controller: ctrl-cf-super
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-super, br-cf-super, br-cf-super, br-cf-super-hot]
    # In-set reducer, as in research.yaml, but a different reducer model: the
    # reducer is Super here and MiMo there, so that confound is not held
    # constant between the two files.
    reducer: red-cf-super
    min_branches: 4             # hard quorum; less is a traced degraded turn
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags

  # ===== GLM 5.3 acting agent, Zhipu/DeepSeek ensemble (probe before use) =====
  ctl/cf-glm53:
    controller: ctrl-cf-glm53
    reason_mode: "off"
  rp/cf-gd-core:
    controller: ctrl-cf-glm53
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-glm53, br-cf-deepseek-pro, br-cf-glm53-flash, br-cf-deepseek-flash]
    reducer: red-cf-glm53-flash
    min_branches: 4
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags

  # ===== DeepSeek V4 Pro acting agent, same ensemble (probe before use) =====
  ctl/cf-deepseek-pro:
    controller: ctrl-cf-deepseek-pro
    reason_mode: "off"
  rp/cf-deepseek-captain:
    controller: ctrl-cf-deepseek-pro
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-glm53, br-cf-deepseek-pro, br-cf-glm53-flash, br-cf-deepseek-flash]
    reducer: red-cf-glm53-flash
    min_branches: 4
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags

  # ===== best-model families (conformance-probed 2026-09-10) =====
  # Cross-family directed deliberation: GLM 5.3 + DeepSeek V4 Pro + Nemotron
  # Ultra branches under a verified Super reducer. Qwen 3.8-27B is excluded:
  # it 400s on any trajectory carrying the injected second system message, so
  # it cannot serve any role in this architecture. Muse has no Workers AI
  # presence and needs a Responses-API transport that does not exist here.
  # Ultra serves branches only: its json_object reducer output did not parse.
  ctl/glm53-best:
    controller: ctrl-cf-glm53
    reason_mode: "off"
  noop/glm53-best:
    controller: ctrl-cf-glm53
    reason_mode: noop
    controller_prompt: deliberate-directed
    max_reason_calls: 2
  rp/glm53-best:
    controller: ctrl-cf-glm53
    reason_mode: live
    controller_prompt: deliberate-directed
    branches: [br-cf-glm53, br-cf-deepseek-pro, br-zen-ultra, br-cf-glm53-flash-hot]
    reducer: red-cf-super
    min_branches: 4
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags
  ctl/glm53-flash-best:
    controller: ctrl-cf-glm53-flash
    reason_mode: "off"
  noop/glm53-flash-best:
    controller: ctrl-cf-glm53-flash
    reason_mode: noop
    controller_prompt: deliberate-directed
    max_reason_calls: 2
  rp/glm53-flash-best:
    controller: ctrl-cf-glm53-flash
    reason_mode: live
    controller_prompt: deliberate-directed
    branches: [br-cf-glm53, br-cf-deepseek-pro, br-zen-ultra, br-cf-glm53-flash-hot]
    reducer: red-cf-super
    min_branches: 4
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags

  # ===== probe-only aliases (existence only for probing, never benchmarked) =====

  ctl/cf-glm53-flash:
    controller: ctrl-cf-glm53-flash
    reason_mode: "off"
  ctl/cf-qwen38:
    controller: ctrl-cf-qwen38
    reason_mode: "off"
  rp/cf-best-probe:
    controller: ctrl-cf-glm53
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-qwen38, br-cf-qwen38-hot, br-zen-ultra, br-cf-glm53-flash]
    reducer: red-zen-ultra
    min_branches: 4
    max_reason_calls: 2
  rp/or-mercury-probe:
    controller: ctrl-cf-glm53
    reason_mode: live
    controller_prompt: concise
    branches: [br-or-mercury]
    reducer: red-or-mercury
    min_branches: 1
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags
  rp/muse-controller-probe:
    controller: ctrl-muse-contrib
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-glm53-flash]
    reducer: red-cf-super
    min_branches: 1
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags
  rp/muse-reducer-probe:
    controller: ctrl-cf-glm53
    reason_mode: live
    controller_prompt: concise
    branches: [br-cf-glm53-flash]
    reducer: red-muse-contrib
    min_branches: 1
    max_reason_calls: 2
    branch_timeout_s: 420
    persistence: assistant_tags

# Separate trace file: these exploratory conditions must not be appended into
# the audited research trace that the benchmark runner joins trials against.
trace_path: runs/cloudflare.jsonl
# Exploratory file, so branch and checkpoint text IS captured here, into that
# separate trace only. The active roster (configs/research.yaml) keeps text off.
trace_texts: true
