# ReasonProxy -- Terminal-Bench 4.0 roster (self-contained; new file).
#
# Same three arms and the same model set as configs/hle.yaml, so the two
# benchmarks differ in population and harness, never in who answers or how hard
# they are told to think:
#   ctl/tb4-glm53   raw model, no machinery
#   noop/tb4-glm53  directive, no deliberation behind it
#   rp/tb4-glm53    directive plus the live four-branch ensemble
#
# Reasoning effort is each model's own ceiling, read 2026-09-10 from the public
# OpenRouter catalogue; see configs/hle.yaml for the full ladder table and the
# route-authority caveat (Mercury is authoritative, the Workers AI and Zen
# surfaces are undocumented for this key and MUST be probed live). `max` is also
# GLM 5.3's provider default, which is what the published 41.8% run used.
#
# Deliberation budget differs from the Terminal-Bench 2.0 pilots on purpose.
# There, every deliberation displaced roughly one acting turn inside a 900 s cap
# and that cost was the binding constraint. TB4 gives 8 hours per task, so the
# budget is raised to four calls per trial: the point of this run is to test
# whether the ensemble earns anything once time is no longer what limits it.
# These trials are therefore never pooled with the TB2 pilots.
#
# Keys come from the environment, never this file.

providers:
  cf:
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_TOKEN
    timeout_s: 900
    max_attempts: 6
  zen:
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    timeout_s: 900
    max_attempts: 8
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 900
    max_attempts: 8

backends:
  ctl-tb4-glm53:
    provider: cf
    model: "@cf/zai-org/glm-5.3"
    params: {reasoning_effort: max}      # ceiling and provider default

  br-tb4-glm53:
    provider: cf
    model: "@cf/zai-org/glm-5.3"
    params: {reasoning_effort: max}
  br-tb4-deepseek:
    provider: cf
    model: "@cf/deepseek-ai/deepseek-v4-pro-0813"
    params: {reasoning_effort: max}      # ceiling; default is only high
  br-tb4-ultra:
    provider: zen
    model: nemotron-3-ultra-free
    params: {reasoning_effort: high}     # ceiling; this model has no `max`
  br-tb4-flash:
    provider: cf
    model: "@cf/zai-org/glm-5.3-flash"
    params: {reasoning_effort: max}

  # Mercury: 8/8 reductions accepted with zero degradation in the swap pilot,
  # against Super's 7 HTTP 500/503 flakes under load.
  red-tb4-mercury:
    provider: openrouter
    model: inception/mercury-2.5
    params: {reasoning_effort: high}     # ceiling; default is only medium

virtual_models:
  ctl/tb4-glm53:
    controller: ctl-tb4-glm53
    reason_mode: "off"

  noop/tb4-glm53:
    controller: ctl-tb4-glm53
    reason_mode: noop
    controller_prompt: deliberate-directed
    max_reason_calls: 4

  rp/tb4-glm53:
    controller: ctl-tb4-glm53
    reason_mode: live
    controller_prompt: deliberate-directed
    branches: [br-tb4-glm53, br-tb4-deepseek, br-tb4-ultra, br-tb4-flash]
    branch_prompt: roles
    branch_roles: [challenger, alternative, evidence, checker]
    reducer: red-tb4-mercury
    min_branches: 3
    max_reason_calls: 4
    branch_timeout_s: 600
    persistence: assistant_tags

# Separate trace: TB4 observations join trials against this file only.
trace_path: runs/tb4.jsonl
trace_texts: false
