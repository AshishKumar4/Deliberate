[project]
name = "reasonproxy"
version = "0.1.0"
description = "Stateless branch-and-collapse reasoning proxy for frozen LLM agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
reasonproxy = "reasonproxy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasonproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Official harnesses and benchmark snapshots this repo is pinned against.
# They are NOT Python dependencies: Pier, Harbor and mini-swe-agent are used as
# installed CLIs (uv tools) and mini-swe-agent additionally runs *inside* the
# sandbox, installed there by the harness at the version below. The benchmark
# runner (scripts/benchmark.py) reads this table, refuses to freeze a manifest
# when an installed version or clone HEAD disagrees, and needs no dependency
# beyond the base install.
[tool.reasonproxy.harnesses]
pier = "0.3.1"
harbor = "0.22.0"
mini_swe_agent = "2.4.6"
deepswe_commit = "0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea"
terminal-bench-2_commit = "2fd12b88aafdd04a52c298e3940bcb189f9766d6"
