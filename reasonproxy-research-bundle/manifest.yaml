project: ReasonProxy
working_title: 'Externalized Deliberation: A Stateless Branch-and-Collapse Reasoning
  Tool for Frozen Language-Model Agents'
status: design-and-evaluation-specification
snapshot_date: 2026-09-04
claims_benchmark_results: false
canonical_endpoint: /v1/chat/completions
core_operator: reason
persistence_default: auto
preferred_compatible_persistence: assistant_tags
server_semantics: semantically_stateless_across_requests
normative_precedence:
- 03_STATELESS_PROXY_SPEC.md
- 06_PROMPTS_CONFIG_AND_TRACES.md
- 05_IMPLEMENTATION_ROADMAP.md
- README.md
closest_prior_work:
  title: 'Second Thought: Reasoning in Parallel as LLM Agents Act and Observe'
  arxiv: '2608.13667'
  implication: Do not claim first mid-trajectory full-context parallel reasoning.
primary_benchmarks:
- DeepSWE
- Terminal-Bench 2.1
- FrontierSWE v2
secondary_benchmarks:
- Terminal-Bench-Science
- ARC-AGI-3
files:
- path: README.md
  purpose: bundle orientation and design summary
- path: AGENT_HANDOFF.md
  purpose: ordered implementation/evaluation instructions for coding agents
- path: 01_RESEARCH_SPEC.md
  purpose: formal research question, hypotheses, novelty, and final design
- path: 02_LITERATURE_REVIEW.md
  purpose: prior-art taxonomy and closest-work analysis
- path: 03_STATELESS_PROXY_SPEC.md
  purpose: normative protocol and systems contract
- path: 04_BENCHMARK_PLAN.md
  purpose: benchmark integration, controls, statistics, and reporting
- path: 05_IMPLEMENTATION_ROADMAP.md
  purpose: repository architecture, milestones, tests, telemetry, and risks
- path: 06_PROMPTS_CONFIG_AND_TRACES.md
  purpose: exact prompts, tool schema, wire traces, and pseudocode
- path: 07_PAPER_PLAN.md
  purpose: claims, paper structure, figures, objections, and publication bar
- path: SOURCES.md
  purpose: verified primary-source catalog and dated snapshots
- path: REFERENCES.bib
  purpose: core academic BibTeX entries
- path: reasonproxy.example.yaml
  purpose: illustrative machine-readable V1 configuration
- path: MASTER_GUIDE.md
  purpose: all substantive documents concatenated for single-context ingestion
- path: SHA256SUMS
  purpose: integrity hashes generated at bundle assembly
adjacent_prior_work:
- title: 'SpecCoT: Accelerating Chain-of-Thought Reasoning through Speculative Exploration'
  role: parallel cheap reasoning-step drafts plus verification
- title: 'Council Mode: Mitigating Hallucination and Bias in LLMs via Multi-Agent
    Consensus'
  role: triaged heterogeneous generation plus consensus synthesis
- title: 'iMAD: Intelligent Multi-Agent Debate for Efficient and Accurate LLM Inference'
  role: learned selective triggering of expensive multi-agent inference
- title: Efficient Agentic Reasoning Through Self-Regulated Simulative Planning
  role: reactive/planning/self-regulation decomposition
